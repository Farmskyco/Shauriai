version: '3.8'

services:
  app:
    build: .
    container_name: agronomic-chatbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./audio_cache:/app/audio_cache
    networks:
      - agronomic-network

  postgres:
    image: postgres:14-alpine
    container_name: agronomic-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agronomic-network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: agronomic-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - agronomic-network
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: agronomic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./audio_cache:/var/www/audio:ro
    depends_on:
      - app
    networks:
      - agronomic-network

volumes:
  postgres-data:
  redis-data:

networks:
  agronomic-network:
    driver: bridge
